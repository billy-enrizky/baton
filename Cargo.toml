[package]
name = "baton"
version = "0.3.0"
edition = "2021"
description = "One terminal CLI for every coding agent harness. Same thread, any model, native prompt caching."
license = "MIT"

[[bin]]
name = "baton"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
base64 = "0.22"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true

# Tests keep file and line in backtraces without full debug info. Measured
# cold on a fresh target: 65.3 user seconds and a 1.0 GB target, against 72.9
# and 1.2 GB at the default. The runner is CPU-bound, so that CPU time is the
# number that moves the CI job.
[profile.test]
debug = "line-tables-only"
