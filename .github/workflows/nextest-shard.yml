name: Nextest shard experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    name: Nextest shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore Rust toolchain cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.rustup
          key: rustup-1.100.0-${{ runner.os }}-${{ runner.arch }}-test
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: baton-v2-${{ runner.os }}-${{ runner.arch }}-test
          key: ${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          save-if: false
      - name: Install nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-nextest
      - name: Run shard
        run: |
          set -euo pipefail
          /usr/bin/time -p cargo nextest run --locked --partition=count:${{ matrix.shard }}/2 --no-fail-fast
